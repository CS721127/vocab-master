name: Web checks
on:
  push:
    paths: ['web-app/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web-app/**', '.github/workflows/web-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Production smoke checks
        run: |
          npm start > /tmp/vocab-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke
